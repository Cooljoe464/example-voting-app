apiVersion: v1
kind: Service
metadata:
  name: result
  labels:
    app: result
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.result.service.type }}
  selector:
    app: result
  ports:
    - name: result-service
      port: {{ .Values.result.service.port }}
      targetPort: result
      {{- if eq .Values.result.service.type "NodePort" }}
      nodePort: {{ .Values.result.service.nodePort }}
      {{- end }}

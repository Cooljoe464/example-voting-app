apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    app: vote
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    app: vote
  ports:
    - name: vote-service
      port: {{ .Values.vote.service.port }}
      targetPort: vote
      {{- if eq .Values.vote.service.type "NodePort" }}
      nodePort: {{ .Values.vote.service.nodePort }}
      {{- end }}
